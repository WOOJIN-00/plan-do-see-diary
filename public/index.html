<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플랜두씨 다이어리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">플랜두씨<span>.</span></div>
      <nav class="nav">
        <button class="nav-btn active" data-view="plans">계획</button>
        <button class="nav-btn" data-view="completed">완료 계획</button>
        <button class="nav-btn" data-view="calendar">자격증 캘린더</button>
      </nav>
    </aside>

    <main class="content">
      <!-- 계획 뷰 -->
      <section id="view-plans" class="view active">
        <header class="view-header">
          <h1>내 계획</h1>
          <button id="btn-new-plan" class="btn primary">+ 새 계획</button>
        </header>

        <div id="plan-form-wrap" class="form-card hidden">
          <h2 id="plan-form-title">새 계획</h2>
          <form id="plan-form" novalidate>
            <input type="hidden" name="id" />
            <label>제목
              <input type="text" name="title" required placeholder="예: 네트워크 기초 끝내기" />
            </label>
            <div class="row">
              <label>시작일
                <input type="date" name="period_start" required />
              </label>
              <label>종료일
                <input type="date" name="period_end" required />
              </label>
            </div>
            <p id="plan-date-error" class="field-error hidden">종료일은 시작일보다 빠를 수 없습니다.</p>
            <div class="row">
              <label>우선순위
                <select name="priority" required>
                  <option value="">선택하세요</option>
                  <option value="high">높음</option>
                  <option value="mid">보통</option>
                  <option value="low">낮음</option>
                </select>
              </label>
              <label>예상 시간(시간)
                <input type="number" name="estimated_hours" min="0" step="0.5" required />
              </label>
            </div>
            <label>성공 기준
              <input type="text" name="success_criteria" required placeholder="예: OSI 7계층 설명 가능" />
            </label>
            <p id="plan-required-error" class="field-error hidden"></p>
            <div class="form-actions">
              <button type="button" id="btn-cancel-plan" class="btn ghost">취소</button>
              <button type="submit" class="btn primary">저장</button>
            </div>
          </form>
        </div>

        <div id="plan-list" class="plan-list"></div>
        <p id="plan-empty" class="empty hidden">아직 세운 계획이 없습니다. 위 버튼으로 첫 계획을 만들어보세요.</p>
      </section>

      <!-- 완료 계획 뷰 -->
      <section id="view-completed" class="view">
        <header class="view-header">
          <h1>완료 계획</h1>
        </header>
        <div id="completed-plan-list" class="plan-list"></div>
        <p id="completed-plan-empty" class="empty hidden">아직 완료된 계획이 없습니다. 계획의 할 일을 모두 체크하면 이곳으로 옮겨져요.</p>
      </section>

      <!-- 자격증 캘린더 뷰 -->
      <section id="view-calendar" class="view">
        <header class="view-header">
          <h1>자격증 일정</h1>
          <button id="btn-new-event" class="btn primary">+ 일정 추가</button>
        </header>

        <div id="event-form-wrap" class="form-card hidden">
          <h2>새 일정</h2>
          <form id="event-form" novalidate>
            <label>일정 이름
              <input type="text" name="title" required placeholder="예: 정보처리산업기사 필기접수" />
            </label>
            <div class="row">
              <label>시작일
                <input type="date" name="start_date" required />
              </label>
              <label>종료일
                <input type="date" name="end_date" />
              </label>
            </div>
            <p id="event-date-error" class="field-error hidden">종료일은 시작일보다 빠를 수 없습니다.</p>
            <label>유형
              <select name="category" required>
                <option value="apply">원서접수</option>
                <option value="written">필기시험</option>
                <option value="practical">실기시험</option>
                <option value="result">합격 발표</option>
              </select>
            </label>
            <div class="form-actions">
              <button type="button" id="btn-cancel-event" class="btn ghost">취소</button>
              <button type="submit" class="btn primary">저장</button>
            </div>
          </form>
        </div>

        <div class="calendar-card">
          <div class="calendar-nav">
            <button id="cal-prev" class="btn ghost small">◀</button>
            <div id="cal-title" class="cal-title"></div>
            <button id="cal-next" class="btn ghost small">▶</button>
          </div>
          <div class="calendar-weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
        <div id="calendar-legend" class="calendar-legend"></div>
      </section>
    </main>
  </div>

  <!-- 일정 이벤트 모달 -->
  <div id="event-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="event-modal-date"></h3>
        <button id="event-modal-close" class="modal-close">×</button>
      </div>
      <div id="event-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 삭제 확인 팝업 -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal confirm-modal">
      <p id="confirm-modal-message"></p>
      <div class="form-actions">
        <button id="confirm-modal-cancel" class="btn ghost" type="button">취소</button>
        <button id="confirm-modal-ok" class="btn danger-solid" type="button">삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
